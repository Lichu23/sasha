# How to photograph the nutrition practice template (/nutricion) for the 60 s ad.
# The app runs from the project's own dev server (npm run dev -- -p 3100) and is never touched: everything it shows lives in the
# browser (localStorage). The booking and the agenda are TAKES (one continuous recording of a person using the page, frame by
# frame on a paused clock): no cross-fades, the real animation of the sheet, the real typing, the real payment. Generated by
# scratchpad/gen_capture.py from the timeline in its comments; edit the timeline, not the YAML.
app:
  url: ${APP_URL:-http://localhost:3100}

viewport: {width: 390, height: 844, scale: 3}
# The home indicator of the phone: apps leave room for it (the booking sheets pad their footers with env(safe-area-inset-bottom)).
safeArea: {top: 0, bottom: 34}
locale: es-AR
timezone: America/Argentina/Buenos_Aires
# A Tuesday morning, so the calendar, the open hours and the seeded agenda never change between captures.
clock: '2026-11-24T10:00:00-03:00'
inputs: [scripts]
routes:
  - {url: '**/va.vercel-scripts.com/**', file: scripts/empty.js, contentType: application/javascript}

sets:
  main:
    screens:
      - name: home
        steps:
          - goto: /nutricion
          - wait: 700
        elements:
          hero: main section >> nth=0
          servicios: '#servicios'
          pasos: '#pasos-titulo'
          opiniones: '#opiniones-titulo'
          tips: '#tips-titulo'
          faq: '#faq-titulo'

      # THE BOOKING, one take: offer, online, day, scroll to the times, time, pay sheet, typing, card and Mercado Pago, pay, confirmed
      - name: flow
        settleMs: 700
        steps:
          - goto: /nutricion/reservar
          - wait: 900
          - scroll: {to: 'h2:has-text("1 ·")', offset: 120}
          - wait: 500
          - record:
              frames: 585
              fps: 30
              slow: 0.5
              actions:
