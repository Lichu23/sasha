      # the panel's agenda with the new turno pinned on top (still: the notification slides its card in)
      - name: adminAgenda
        steps:
          - goto: '/nutricion/admin?nuevo={ref}'
          - wait: {for: 'ul[aria-label="Citas"] li'}
          - wait: 900
        elements:
          newCard: 'ul[aria-label="Citas"] li >> nth=0'

      # THE PANEL, one take: the patient arrived, the filter by status, back to all, the week
      - name: agendaTake
        settleMs: 700
        steps:
          - goto: '/nutricion/admin?nuevo={ref}'
          - wait: {for: 'ul[aria-label="Citas"] li'}
          - wait: 900
          - record:
              frames: 270
              fps: 30
              slow: 0.5
              actions:
              - at: 30
                click: 'ul[aria-label="Citas"] > li:first-child button'
                elements: {arrived: 'ul[aria-label="Citas"] > li:first-child button'}
                motion: 12
              - at: 90
                click: '[aria-label="Estado"] [data-value=asistio]'
                elements: {vineronTab: '[aria-label="Estado"] [data-value=asistio]'}
                motion: 12
              - at: 135
                click: '[aria-label="Estado"] [data-value=todas]'
                elements: {todasTab: '[aria-label="Estado"] [data-value=todas]'}
                motion: 12
              - at: 180
                click: '[aria-label="Vista"] [data-value=semana]'
                elements: {semanaTab: '[aria-label="Vista"] [data-value=semana]'}
                motion: 24

      - name: adminPacientes
        steps:
          - goto: /nutricion/admin/pacientes
          - wait: {for: 'ul[aria-label="Pacientes"] li'}
          - wait: 900
        elements:
          summary: 'section[aria-label="Resumen"]'
          firstPatient: 'ul[aria-label="Pacientes"] li >> nth=0'

      - name: adminSales
        settleMs: 1500
        steps:
          - goto: /nutricion/admin/ventas
          - wait: {for: 'p.text-5xl:not(:has-text("–"))'}
          - wait: 1500
          - click: {selector: '[aria-label="Período"] [data-value="7"]', tap: true}
          - wait: 1200
        scroll: {to: '[aria-label="Período"]', offset: 72}
        elements:
          revenueCard: 'section[aria-label="Resumen del período"] > div >> nth=0'
          revenueNumber: p.text-5xl >> nth=0
          chartArea: 'section[aria-labelledby="by-day"]'
